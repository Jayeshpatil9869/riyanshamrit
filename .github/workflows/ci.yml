name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - run: pnpm --filter @riyanshamrit/api test
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod || true
      - name: Semgrep (if available)
        continue-on-error: true
        run: |
          pip install semgrep
          semgrep --config=auto --error --quiet apps packages || true
